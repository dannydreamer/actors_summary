<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SimCenter — דוח תשלום שחקנים</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="parse.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: #f5f7fa;
    color: #1a1a2e;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem;
  }

  .card {
    background: #fff;
    border-radius: 12px;
    box-shadow: 0 4px 24px rgba(0,0,0,0.10);
    padding: 2.5rem 3rem;
    max-width: 620px;
    width: 100%;
  }

  h1 {
    font-size: 1.5rem;
    margin-bottom: 0.4rem;
    color: #1a1a2e;
  }

  .subtitle {
    font-size: 0.92rem;
    color: #6b7280;
    margin-bottom: 2rem;
  }

  .input-section { margin-bottom: 1.5rem; }

  .input-section label {
    display: block;
    font-weight: 600;
    margin-bottom: 0.5rem;
    font-size: 0.95rem;
  }

  .input-row {
    display: flex;
    gap: 0.5rem;
  }

  input[type="text"], input[type="file"] {
    flex: 1;
    padding: 0.55rem 0.85rem;
    border: 1.5px solid #d1d5db;
    border-radius: 7px;
    font-size: 0.93rem;
    background: #fff;
    direction: ltr;
    transition: border-color 0.15s;
  }

  input[type="file"] { direction: rtl; cursor: pointer; }
  input[type="text"]:focus { outline: none; border-color: #4f46e5; }
  input:disabled { background: #f3f4f6; cursor: not-allowed; opacity: 0.6; }

  .btn {
    padding: 0.55rem 1.2rem;
    border: none;
    border-radius: 7px;
    font-size: 0.93rem;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s, opacity 0.15s;
  }

  .btn-primary  { background: #4f46e5; color: #fff; }
  .btn-primary:hover:not(:disabled)  { background: #4338ca; }
  .btn-secondary { background: #e5e7eb; color: #374151; }
  .btn-secondary:hover:not(:disabled) { background: #d1d5db; }
  .btn-success  { background: #16a34a; color: #fff; }
  .btn-success:hover:not(:disabled)  { background: #15803d; }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }

  .divider {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    margin: 1.25rem 0;
    color: #9ca3af;
    font-size: 0.85rem;
  }
  .divider::before, .divider::after {
    content: '';
    flex: 1;
    height: 1px;
    background: #e5e7eb;
  }

  .api-key-row {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    margin-top: 0.5rem;
    font-size: 0.85rem;
    color: #6b7280;
  }
  .api-key-row input {
    flex: 1;
    font-size: 0.85rem;
    padding: 0.35rem 0.6rem;
  }

  /* Error screen */
  .error-panel {
    background: #fef2f2;
    border: 1.5px solid #fca5a5;
    border-radius: 9px;
    padding: 1.25rem 1.5rem;
    margin-bottom: 1.5rem;
  }
  .error-panel h2 {
    font-size: 1.05rem;
    color: #b91c1c;
    margin-bottom: 0.75rem;
  }
  .error-list { list-style: none; margin-bottom: 0.5rem; }
  .error-list li {
    padding: 0.2rem 0;
    font-size: 0.93rem;
    color: #7f1d1d;
  }
  .error-list li::before { content: '• '; font-weight: bold; }
  .error-note {
    font-size: 0.88rem;
    color: #9a3412;
    margin-top: 0.75rem;
    border-top: 1px solid #fca5a5;
    padding-top: 0.75rem;
  }

  /* Success screen */
  .success-panel {
    background: #f0fdf4;
    border: 1.5px solid #86efac;
    border-radius: 9px;
    padding: 1.5rem;
    margin-bottom: 1.5rem;
    text-align: center;
  }
  .success-panel .summary {
    font-size: 1.15rem;
    font-weight: 700;
    color: #15803d;
    margin-bottom: 1rem;
  }

  #loading-msg { color: #4f46e5; font-size: 0.93rem; margin-top: 0.75rem; }
  .hidden { display: none !important; }
</style>
</head>
<body>

<div class="card">
  <h1>דוח תשלום שחקנים</h1>
  <p class="subtitle">SimCenter — כלי פנימי לסיכום חודשי</p>

  <!-- ── STATE 1: Input ── -->
  <div id="state-input">

    <div class="input-section">
      <label for="url-input">קישור לגיליון Google Sheets</label>
      <div class="input-row">
        <input type="text" id="url-input" placeholder="https://docs.google.com/spreadsheets/d/..." />
        <button class="btn btn-primary" id="btn-load-url">טען</button>
      </div>
      <div class="api-key-row">
        <span>מפתח API:</span>
        <input type="text" id="api-key-input" placeholder="AIza..." />
      </div>
    </div>

    <div class="divider">או</div>

    <div class="input-section">
      <label for="file-input">העלאת קובץ Excel</label>
      <input type="file" id="file-input" accept=".xlsx" />
    </div>

    <div id="loading-msg" class="hidden">טוען נתונים...</div>
  </div>

  <!-- ── STATE 2: Validation Error ── -->
  <div id="state-error" class="hidden">
    <div class="error-panel">
      <h2>⚠ נמצאו שמות חלקיים — יש לתקן בגיליון לפני המשך</h2>
      <ul class="error-list" id="error-list"></ul>
      <p class="error-note">נא לוודא שכל שם שחקן/ית כולל שם פרטי ושם משפחה, מופרדים בפסיק.</p>
    </div>
    <button class="btn btn-secondary" id="btn-back-error">חזור</button>
  </div>

  <!-- ── STATE 3: Success ── -->
  <div id="state-success" class="hidden">
    <div class="success-panel">
      <div class="summary" id="success-summary"></div>
      <button class="btn btn-success" id="btn-download">הורד דוח Excel</button>
    </div>
    <button class="btn btn-secondary" id="btn-back-success">התחל מחדש</button>
  </div>
</div>

<script>
// ─────────────────────────────────────────────
//  EXCEL OUTPUT  (Session 3 — lives here, not in parse.js)
// ─────────────────────────────────────────────

function generateExcel(workshops, actors) {
  const wb = XLSX.utils.book_new();

  // Sheet 1 — Workshop Summary
  const ws1Data = [['תאריך', 'שם לקוח', 'שחקנים']];
  workshops.forEach(w => ws1Data.push([
    w.date,
    w.client,
    w.actors.length ? w.actors.join(', ') : '—',
  ]));
  const ws1 = XLSX.utils.aoa_to_sheet(ws1Data);
  ws1['!cols'] = [{ wch: 8 }, { wch: 36 }, { wch: 52 }];
  ws1['!dir'] = 'rtl';
  applyAlternatingRows(ws1, ws1Data.length, 3);
  XLSX.utils.book_append_sheet(wb, ws1, 'סיכום סדנאות');

  // Sheet 2 — Actor Summary
  const ws2Data = [['שם שחקן/ית', 'מספר סדנאות', 'שמות סדנאות', 'קיבלנו הזמנת תשלום']];
  actors.forEach(a => ws2Data.push([a.name, a.count, a.clients.join(', '), '']));
  ws2Data.push(['סה"כ שחקנים', actors.length, '', '']);
  const ws2 = XLSX.utils.aoa_to_sheet(ws2Data);
  ws2['!cols'] = [{ wch: 22 }, { wch: 14 }, { wch: 52 }, { wch: 22 }];
  ws2['!dir'] = 'rtl';
  applyAlternatingRows(ws2, ws2Data.length, 4);
  applyPaymentColumnFill(ws2, ws2Data.length);
  XLSX.utils.book_append_sheet(wb, ws2, 'סיכום שחקנים');

  const { month, year } = SimCenterParser.inferMonthYear(workshops);
  XLSX.writeFile(wb, `actor_report_${month}_${year}.xlsx`);
}

function cellAt(c, r) { return XLSX.utils.encode_cell({ c, r }); }

function ensureCell(ws, addr) {
  if (!ws[addr]) ws[addr] = { v: '', t: 's' };
  if (!ws[addr].s) ws[addr].s = {};
}

function applyAlternatingRows(ws, rowCount, colCount) {
  for (let r = 1; r < rowCount; r += 2) {
    for (let c = 0; c < colCount; c++) {
      const addr = cellAt(c, r);
      ensureCell(ws, addr);
      ws[addr].s.fill = { fgColor: { rgb: 'F3F4F6' }, patternType: 'solid' };
    }
  }
}

function applyPaymentColumnFill(ws, rowCount) {
  for (let r = 1; r < rowCount; r++) {
    const addr = cellAt(3, r);
    ensureCell(ws, addr);
    ws[addr].s = { fill: { fgColor: { rgb: 'D1FAE5' }, patternType: 'solid' } };
  }
}

// ─────────────────────────────────────────────
//  UI STATE MACHINE
// ─────────────────────────────────────────────

const stateInput   = document.getElementById('state-input');
const stateError   = document.getElementById('state-error');
const stateSuccess = document.getElementById('state-success');
const urlInput     = document.getElementById('url-input');
const apiKeyInput  = document.getElementById('api-key-input');
const fileInput    = document.getElementById('file-input');
const loadingMsg   = document.getElementById('loading-msg');

let _pendingWorkshops = null;
let _pendingActors    = null;

// Mutual exclusivity
urlInput.addEventListener('input', () => {
  const hasUrl = urlInput.value.trim().length > 0;
  fileInput.disabled = hasUrl;
});
fileInput.addEventListener('change', () => {
  const hasFile = fileInput.files.length > 0;
  urlInput.disabled = hasFile;
  apiKeyInput.disabled = hasFile;
});

// Google Sheets URL path
document.getElementById('btn-load-url').addEventListener('click', async () => {
  const url    = urlInput.value.trim();
  const apiKey = apiKeyInput.value.trim();
  if (!url || !apiKey) { alert('נא להכניס כתובת URL ומפתח API'); return; }

  const match = url.match(/\/spreadsheets\/d\/([a-zA-Z0-9_-]+)/);
  if (!match) { alert('כתובת URL לא תקינה'); return; }

  loadingMsg.classList.remove('hidden');
  try {
    const endpoint =
      `https://sheets.googleapis.com/v4/spreadsheets/${match[1]}` +
      `?includeGridData=true&key=${apiKey}`;
    const res = await fetch(endpoint);
    if (!res.ok) throw new Error(`שגיאת API: ${res.status}`);
    const json = await res.json();
    handleWorkbook(SimCenterParser.googleSheetsResponseToWorkbook(json));
  } catch (e) {
    alert('שגיאה בטעינת הגיליון: ' + e.message);
  } finally {
    loadingMsg.classList.add('hidden');
  }
});

// Excel upload path
fileInput.addEventListener('change', e => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    const wb = XLSX.read(new Uint8Array(ev.target.result), { type: 'array' });
    handleWorkbook(wb);
  };
  reader.readAsArrayBuffer(file);
});

function handleWorkbook(workbook) {
  const result = SimCenterParser.parseWorkbook(workbook);
  result.ok ? showSuccess(result.workshops, result.actors) : showError(result.errors);
}

function showError(errors) {
  const list = document.getElementById('error-list');
  list.innerHTML = '';
  errors.forEach(({ name, date, client }) => {
    const li = document.createElement('li');
    li.textContent = `${name} — ${date} ${client}`;
    list.appendChild(li);
  });
  stateInput.classList.add('hidden');
  stateError.classList.remove('hidden');
}

function showSuccess(workshops, actors) {
  _pendingWorkshops = workshops;
  _pendingActors    = actors;
  document.getElementById('success-summary').textContent =
    `${workshops.length} סדנאות | ${actors.length} שחקנים`;
  stateInput.classList.add('hidden');
  stateSuccess.classList.remove('hidden');
}

document.getElementById('btn-download').addEventListener('click', () => {
  generateExcel(_pendingWorkshops, _pendingActors);
});

document.getElementById('btn-back-error').addEventListener('click', resetUI);
document.getElementById('btn-back-success').addEventListener('click', resetUI);

function resetUI() {
  urlInput.value = '';
  urlInput.disabled = false;
  apiKeyInput.value = '';
  apiKeyInput.disabled = false;
  fileInput.value = '';
  fileInput.disabled = false;
  _pendingWorkshops = null;
  _pendingActors    = null;
  stateError.classList.add('hidden');
  stateSuccess.classList.add('hidden');
  stateInput.classList.remove('hidden');
}
</script>
</body>
</html>
