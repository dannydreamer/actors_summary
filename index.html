<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SimCenter — דוח תשלום שחקנים</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="parse.js"></script>
<script src="generate.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: #f5f7fa;
    color: #1a1a2e;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem;
  }

  .card {
    background: #fff;
    border-radius: 12px;
    box-shadow: 0 4px 24px rgba(0,0,0,0.10);
    padding: 2.5rem 3rem;
    max-width: 620px;
    width: 100%;
  }

  h1 {
    font-size: 1.5rem;
    margin-bottom: 0.4rem;
    color: #1a1a2e;
  }

  .subtitle {
    font-size: 0.92rem;
    color: #6b7280;
    margin-bottom: 2rem;
  }

  .input-section { margin-bottom: 1.5rem; }

  .input-section label {
    display: block;
    font-weight: 600;
    margin-bottom: 0.5rem;
    font-size: 0.95rem;
  }

  input[type="file"] {
    width: 100%;
    padding: 0.55rem 0.85rem;
    border: 1.5px solid #d1d5db;
    border-radius: 7px;
    font-size: 0.93rem;
    background: #fff;
    direction: rtl;
    cursor: pointer;
  }

  .btn {
    padding: 0.55rem 1.2rem;
    border: none;
    border-radius: 7px;
    font-size: 0.93rem;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s, opacity 0.15s;
  }

  .btn-secondary { background: #e5e7eb; color: #374151; }
  .btn-secondary:hover { background: #d1d5db; }
  .btn-success  { background: #16a34a; color: #fff; }
  .btn-success:hover { background: #15803d; }

  /* Error screen */
  .error-panel {
    background: #fef2f2;
    border: 1.5px solid #fca5a5;
    border-radius: 9px;
    padding: 1.25rem 1.5rem;
    margin-bottom: 1.5rem;
  }
  .error-panel h2 {
    font-size: 1.05rem;
    color: #b91c1c;
    margin-bottom: 0.75rem;
  }
  .error-list { list-style: none; margin-bottom: 0.5rem; }
  .error-list li {
    padding: 0.2rem 0;
    font-size: 0.93rem;
    color: #7f1d1d;
  }
  .error-list li::before { content: '• '; font-weight: bold; }
  .error-note {
    font-size: 0.88rem;
    color: #9a3412;
    margin-top: 0.75rem;
    border-top: 1px solid #fca5a5;
    padding-top: 0.75rem;
  }

  /* Success screen */
  .success-panel {
    background: #f0fdf4;
    border: 1.5px solid #86efac;
    border-radius: 9px;
    padding: 1.5rem;
    margin-bottom: 1.5rem;
    text-align: center;
  }
  .success-panel .summary {
    font-size: 1.15rem;
    font-weight: 700;
    color: #15803d;
    margin-bottom: 1rem;
  }

  .hidden { display: none !important; }
</style>
</head>
<body>

<div class="card">
  <h1>דוח תשלום שחקנים</h1>
  <p class="subtitle">SimCenter — כלי פנימי לסיכום חודשי</p>

  <!-- ── STATE 1: Input ── -->
  <div id="state-input">
    <div class="input-section">
      <label for="file-input">העלאת קובץ Excel</label>
      <input type="file" id="file-input" accept=".xlsx" />
    </div>
  </div>

  <!-- ── STATE 2: Validation Error ── -->
  <div id="state-error" class="hidden">
    <div class="error-panel">
      <h2>⚠ נמצאו שמות חלקיים — יש לתקן בגיליון לפני המשך</h2>
      <ul class="error-list" id="error-list"></ul>
      <p class="error-note">נא לוודא שכל שם שחקן/ית כולל שם פרטי ושם משפחה, מופרדים בפסיק.</p>
    </div>
    <button class="btn btn-secondary" id="btn-back-error">חזור</button>
  </div>

  <!-- ── STATE 3: Success ── -->
  <div id="state-success" class="hidden">
    <div class="success-panel">
      <div class="summary" id="success-summary"></div>
      <button class="btn btn-success" id="btn-download">הורד דוח Excel</button>
    </div>
    <button class="btn btn-secondary" id="btn-back-success">התחל מחדש</button>
  </div>
</div>

<script>
const stateInput   = document.getElementById('state-input');
const stateError   = document.getElementById('state-error');
const stateSuccess = document.getElementById('state-success');
const fileInput    = document.getElementById('file-input');

let _pendingWorkshops = null;
let _pendingActors    = null;

fileInput.addEventListener('change', e => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    const wb = XLSX.read(new Uint8Array(ev.target.result), { type: 'array' });
    handleWorkbook(wb);
  };
  reader.readAsArrayBuffer(file);
});

function handleWorkbook(workbook) {
  const result = SimCenterParser.parseWorkbook(workbook);
  result.ok ? showSuccess(result.workshops, result.actors) : showError(result.errors);
}

function showError(errors) {
  const list = document.getElementById('error-list');
  list.innerHTML = '';
  errors.forEach(({ name, date, client }) => {
    const li = document.createElement('li');
    li.textContent = `${name} — ${date} ${client}`;
    list.appendChild(li);
  });
  stateInput.classList.add('hidden');
  stateError.classList.remove('hidden');
}

function showSuccess(workshops, actors) {
  _pendingWorkshops = workshops;
  _pendingActors    = actors;
  document.getElementById('success-summary').textContent =
    `${workshops.length} סדנאות | ${actors.length} שחקנים`;
  stateInput.classList.add('hidden');
  stateSuccess.classList.remove('hidden');
}

document.getElementById('btn-download').addEventListener('click', () => {
  SimCenterGenerator.downloadReport(_pendingWorkshops, _pendingActors);
});

document.getElementById('btn-back-error').addEventListener('click', resetUI);
document.getElementById('btn-back-success').addEventListener('click', resetUI);

function resetUI() {
  fileInput.value = '';
  _pendingWorkshops = null;
  _pendingActors    = null;
  stateError.classList.add('hidden');
  stateSuccess.classList.add('hidden');
  stateInput.classList.remove('hidden');
}
</script>
</body>
</html>
